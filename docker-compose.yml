services:
  firebase-emulator:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: >
      sh -c "apk add --no-cache openjdk21-jre-headless >/dev/null &&
      npx --yes firebase-tools emulators:start
      --only database --project demo-meridian-pulse"
    ports:
      - "9000:9000"
      - "4000:4000"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FIREBASE_DATABASE_URL: https://demo-meridian-pulse-default-rtdb.firebaseio.com
      FIREBASE_DATABASE_EMULATOR_HOST: firebase-emulator:9000
      CORS_ORIGINS: http://localhost:4173
      LLM_API_MODE: ${LLM_API_MODE:-aicredits}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL_PREFILTER: ${LLM_MODEL_PREFILTER:-gpt-4o-mini}
      LLM_MODEL_SCORER: ${LLM_MODEL_SCORER:-claude-sonnet-4.6}
      AI_CREDITS_KEY: ${AI_CREDITS_KEY:-}
      OPENAI_DIRECT_KEY: ${OPENAI_DIRECT_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - firebase-emulator

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_FIREBASE_DATABASE_URL: http://localhost:9000
    ports:
      - "4173:80"
    depends_on:
      - backend
